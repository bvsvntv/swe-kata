services:
  postgres:
    image: postgres:18-alpine
    container_name: pg-swe-kata

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Kathmandu

    ports:
      - "15432:5432"

    volumes:
      - pg-swe-kata-data:/var/lib/postgresql/data

volumes:
  pg-swe-kata-data:
